{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<section class="page-section auth-section">
<h1 class="page-title">Login</h1>

<form class="form-stack auth-form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Login</button>
</form>

<p class="muted-copy">
    No account yet?
    <a class="text-link" href="{% url 'register' %}">Register here</a>
</p>
</section>
{% endblock %}
